# Compiles the JOSS paper (paper/paper.md) to PDF on push, using the
# Open Journals draft action. Artifact is uploaded; nothing is published.
on:
  push:
    paths: [paper/**, .github/workflows/draft-pdf.yml]
  workflow_dispatch:

name: draft-pdf
permissions: read-all

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
